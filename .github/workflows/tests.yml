name: Leviathan CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pytest

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check src/python/leviathan/ tests/ --ignore E501

      - name: Run equivalence suite
        run: |
          PYTHONPATH=src/python pytest tests/equivalence.py -v

      - name: Run scale smoke test (N=500)
        run: |
          PYTHONPATH=src/python python3 src/python/experiments/scale_runner.py --n 500 --ticks 20
